# kong.yml — Config declarativa (DB-less) del gateway Supabase, MÍNIMA.
# Solo enruta /rest/v1/* -> PostgREST y valida la apikey.
# NO usa auth/realtime/storage/functions.
#
# Las apikeys son las DEMO keys ESTÁNDAR de Supabase self-hosting (públicas:
# están en los docs oficiales, NO son un secreto). Firmadas con el JWT secret
# demo. Para LAN de un boliche alcanzan.
#
# OJO: Kong en modo declarativo DB-less NO interpola env vars en el campo `key`
# de key-auth (ni `${{ }}` —que es de decK— ni vault refs —`key` no es
# referenceable). Por eso van literales acá. Para rotar a llaves reales:
# regenerá las 3 (ver supabase/.env.example) y reemplazá las `key:` de abajo +
# JWT_SECRET. Si querés rotar SIN tocar este archivo, ver la variante con
# envsubst documentada en supabase/.env.example.
#
# Flujo de auth:
#   - El cliente (@supabase/supabase-js) manda `apikey: <key>` Y
#     `Authorization: Bearer <key>`.
#   - key-auth valida el header `apikey` contra estas credenciales (Kong).
#   - PostgREST lee el `Authorization: Bearer <jwt>`, lo valida con
#     PGRST_JWT_SECRET y cambia al rol del claim (`service_role` / `anon`).
_format_version: "3.0"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.zQomPPgIVgwVRMh3NJhhAl2cJ-GKQgNXpMTbIKxKyoo
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxNzk5NTM1NjAwfQ.4HviqYnTKiRK-RJvWzgAAuaFiq8--foTrXQpl7HYMU4

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> http://rest:3000/*"
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
