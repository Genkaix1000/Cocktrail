# Mantiene despierto el servicio de Render durante el horario del boliche.
#
# POR QUÉ ACOTADO Y NO 24/7: el plan gratuito de Render duerme el servicio tras
# 15 minutos sin tráfico y tarda ~1 minuto en despertar, así que la primera
# carga de la noche se hace esperar. Pero la cuota gratuita son 750 horas de
# servicio DESPIERTO por mes y un mes tiene ~730: un ping permanente la consume
# entera y sin margen, y si se agota Render suspende el servicio hasta el mes
# siguiente. Render además puede suspender servicios gratuitos que generen
# tráfico inusual.
#
# Con esta ventana son ~20 h por semana (~87 h/mes), bien lejos del límite.
#
# HORARIOS: los cron de GitHub Actions son SIEMPRE en UTC. Argentina es UTC-3
# todo el año (no hay horario de verano), así que la conversión es fija: +3 h.
#   viernes 20:00 ART = viernes 23:00 UTC
#   sábado  06:00 ART = sábado  09:00 UTC
#
# Si el boliche abre otros días, agregá o cambiá los días de la semana de abajo
# (0=domingo … 5=viernes, 6=sábado), recordando sumarle 3 horas al horario real.

name: Mantener despierto

on:
  schedule:
    # Viernes y sábado, 23:00–23:50 UTC = 20:00–20:50 ART (apertura).
    - cron: "*/10 23 * * 5,6"
    # Sábado y domingo, 00:00–08:50 UTC = 21:00–05:50 ART (el grueso de la noche).
    - cron: "*/10 0-8 * * 6,0"
  # Para despertarlo a mano desde la pestaña Actions si se abre fuera de horario.
  workflow_dispatch:

# Si una corrida se solapa con la anterior (puede pasar si Render tarda en
# despertar), no tiene sentido acumularlas.
concurrency:
  group: mantener-despierto
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar el servicio
        run: |
          # /api/theme es público (no pide sesión) y liviano. Cualquier ruta
          # despierta el servicio entero: es un solo proceso con la API y la web.
          #
          # --max-time 120 y los reintentos son por el arranque en frío: si el
          # servicio estaba dormido, la primera respuesta puede tardar ~1 minuto.
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            https://bosko-7xsy.onrender.com/api/theme)

          echo "Respuesta: HTTP $codigo"

          # Falla la corrida si no está sano, así GitHub manda un mail. Es un
          # chequeo de vida gratis, no solo un ping.
          if [ "$codigo" != "200" ]; then
            echo "::error::El servicio respondió $codigo en vez de 200."
            exit 1
          fi
