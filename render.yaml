# Deploy de BarQR en Render: un solo servicio con los dos procesos (API + web).
# El porqué de no separarlos está en el Dockerfile.
#
# Se usa el runtime de Node y no el Dockerfile: sobre el repo completo, el
# paquete compartido y las migraciones quedan donde el código los espera, sin
# los ajustes que sí necesita la imagen. El Dockerfile queda como alternativa
# (otro hosting, o reproducir el entorno localmente).
#
# Las variables marcadas `sync: false` NO se versionan: se cargan en el
# dashboard (Environment) o por la API. Lista completa abajo.
services:
  - type: web
    name: bosko
    runtime: node
    plan: free
    region: oregon # Render no tiene región en Sudamérica; Oregon es la de menor latencia disponible para AR
    branch: develop # explícito: sin esto tomaría la rama por defecto del repo
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build:cloud
    startCommand: node scripts/start-cloud.mjs

    # Pega al puerto público (Next) y se reenvía a la API: prueba los dos procesos.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # --- Base de datos (Supabase Cloud) ---
      # DATABASE_URL: usar el "Session pooler" (host *.pooler.supabase.com, puerto
      # 5432). NO el transaction pooler: el runner de migraciones toma un advisory
      # lock de sesión que ese modo no sostiene. La conexión directa tampoco sirve:
      # es IPv6-only.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- Sesión ---
      # AUTH_SECRET: >=32 caracteres. Lo usan la API (firma) y la web (validación
      # en el proxy); al vivir los dos en el mismo contenedor, con una alcanza.
      - key: AUTH_SECRET
        generateValue: true

      # --- Credenciales de la app ---
      # Sin defaults: si faltan, el arranque falla (a propósito).
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: CAJA_USER
        sync: false
      - key: CAJA_PASS
        sync: false

      # --- URL pública ---
      # FRONTEND_URL: la URL del servicio (https://barqr.onrender.com). Se usa para
      # CORS y para armar links. Render la expone en RENDER_EXTERNAL_URL, pero se
      # deja explícita para poder apuntar a un dominio propio sin tocar código.
      - key: FRONTEND_URL
        sync: false

      # --- Versión de producto (Sistema → Versión) ---
      # Defaults en código: 0.1.0 / beta. Override acá si un deploy necesita otro tag.
      - key: APP_VERSION
        value: "0.1.0"
      - key: APP_CHANNEL
        value: "beta"

      # --- Mercado Pago (opcional: si faltan, la integración queda inactiva) ---
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_APP_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_TOKEN_SECRET
        sync: false

      # --- Identificación del puesto ---
      - key: BAR_CODE
        sync: false
