version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cocktrail-postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54321:54321"
    command: -p 54321
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 54321"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
